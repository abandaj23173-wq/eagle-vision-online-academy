{% extends "base.html" %}{% block content %}<div class="form"><h2>Payment — {{course.title}}</h2><p>Amount: <strong>${{"%.2f"|format(course.price)}}</strong></p><p class="muted">For the MVP, payment is verified manually. Replace this with your chosen Zimbabwe payment gateway when you are ready for automatic activation.</p><form method="post"><label>Payment method</label><select name="method" required><option>EcoCash</option><option>OneMoney</option><option>Bank Transfer</option><option>Other</option></select><label>Payment reference / transaction ID</label><input name="reference" required><button class="btn">Submit Payment</button></form></div>{% endblock %}
