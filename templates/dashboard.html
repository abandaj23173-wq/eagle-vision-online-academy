{% extends "base.html" %}{% block content %}<div class="container"><h1>Welcome, {{g.user.full_name}}</h1><p class="muted">Your Eagle Vision learning dashboard.</p><div class="cards">{% for c in courses %}<article class="card"><span class="pill">{{c.level}}</span><h3>{{c.title}}</h3><p>Status: <strong>{{c.status}}</strong></p><a class="btn" href="{{url_for('course',course_id=c.id)}}">Open Course</a></article>{% else %}<div class="card"><h3>No courses yet</h3><a class="btn" href="{{url_for('index')}}">Browse Courses</a></div>{% endfor %}</div></div>{% endblock %}
