{% extends "base.html" %}{% block content %}<div class="form"><h2>Course Quiz</h2><form method="post">{% for q in questions %}<div class="lesson"><strong>{{loop.index}}. {{q.question}}</strong><label><input type="radio" name="q{{q.id}}" value="A" required> A. {{q.option_a}}</label><label><input type="radio" name="q{{q.id}}" value="B"> B. {{q.option_b}}</label><label><input type="radio" name="q{{q.id}}" value="C"> C. {{q.option_c}}</label><label><input type="radio" name="q{{q.id}}" value="D"> D. {{q.option_d}}</label></div>{% endfor %}<button class="btn">Submit Quiz</button></form></div>{% endblock %}
